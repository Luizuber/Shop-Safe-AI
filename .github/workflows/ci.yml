name: Validate Shop Safe AI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Secrets and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-secrets.mjs --history
      - run: node docs/validate-vault.mjs

  backend:
    name: API, models and integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backand/backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backand/backend-api/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
      - run: node ml/smoke-built.cjs
        working-directory: .

  frontend:
    name: Extension tests and builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:local

  training-code:
    name: Python syntax and numerical fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m compileall -q ml
      - run: python ml/verify_price.py
      # Training is explicit: CI never downloads raw datasets or retrains models.
